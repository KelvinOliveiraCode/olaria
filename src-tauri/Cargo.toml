[package]
name = "olaria"
version = "0.3.0"
description = "Olaria — construtor de landing pages de arquivo único"
authors = ["Kelvin"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "olaria_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "7"
base64 = "0.22"
dirs = "6"
regex = "1"

[profile.release]
lto = true
strip = true
opt-level = "s"
